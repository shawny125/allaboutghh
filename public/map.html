<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교실 · 선생님 자리 안내도 — ALL ABOUT : 공항고</title>
  <meta name="theme-color" content="#54a8f2" />
  <style>
    :root { color-scheme: light; --navy:#16324f; --blue:#2d78c8; --line:#dbe5ef; --bg:#eef4f8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif; background:var(--bg); color:#172536; }
    .map-app { position:relative; height:100vh; min-height:620px; overflow:hidden; }
    aside { z-index:2; padding:24px 20px; background:rgba(255,255,255,.96); border-right:1px solid var(--line); box-shadow:8px 0 30px rgba(33,61,86,.08); overflow:auto; }
    .brand { display:flex; gap:12px; align-items:center; margin-bottom:24px; }
    .brand-mark { display:grid; place-items:center; width:42px; height:42px; border-radius:14px; background:linear-gradient(145deg,#173b62,#2f80cf); color:#fff; font-weight:900; }
    h1 { margin:0; font-size:20px; line-height:1.25; letter-spacing:-.03em; }
    .sub { margin:5px 0 0; color:#718093; font-size:12px; }
    label.title { display:block; margin:18px 0 8px; color:#556579; font-size:12px; font-weight:750; }
    .search-wrap { position:relative; }
    #search { width:100%; height:44px; padding:0 40px 0 14px; border:1px solid #ccd9e5; border-radius:12px; background:#f8fbfd; outline:none; font:inherit; }
    #search:focus { border-color:#4f94d7; box-shadow:0 0 0 3px rgba(79,148,215,.15); }
    .search-icon { position:absolute; right:13px; top:12px; color:#76889a; }
    #results { display:none; position:absolute; z-index:10; top:48px; width:100%; max-height:240px; overflow:auto; padding:6px; background:white; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 30px rgba(32,54,72,.18); }
    .result { width:100%; padding:10px; border:0; border-radius:8px; background:none; text-align:left; cursor:pointer; }
    .result:hover { background:#edf5fb; }
    .result b { display:block; }
    .result small { color:#718093; }
    .floors { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .floor-btn { height:40px; border:1px solid #d2deea; border-radius:11px; background:white; color:#627286; font-weight:800; cursor:pointer; transition:.18s; }
    .floor-btn:hover { transform:translateY(-1px); border-color:#73a7d7; }
    .floor-btn.active { color:white; background:var(--navy); border-color:var(--navy); }
    .toggle { display:flex; align-items:center; justify-content:space-between; padding:12px 2px; font-size:13px; }
    .switch { position:relative; width:42px; height:24px; border:0; border-radius:99px; background:#bdc9d4; cursor:pointer; }
    .switch::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.2s; }
    .switch.on { background:#2d78c8; }
    .switch.on::after { left:21px; }
    .legend { display:grid; gap:8px; margin-top:12px; padding:14px; border:1px solid #e0e8ef; border-radius:14px; background:#f8fafc; font-size:12px; }
    .legend div { display:flex; align-items:center; gap:9px; }
    .dot { width:10px; height:10px; border-radius:3px; }
    .notice { margin:16px 2px; color:#7b8998; font-size:11px; line-height:1.55; }
    main { position:absolute; inset:0; min-width:0; background:radial-gradient(circle at 50% 35%,#fff 0,#eaf2f7 58%,#dce8f0 100%); }
    #canvas { display:block; width:100%; height:100%; touch-action:none; }
    .topbar { position:absolute; z-index:1; top:18px; left:18px; right:18px; display:flex; justify-content:space-between; pointer-events:none; }
    .pill { padding:9px 13px; border:1px solid rgba(210,225,236,.9); border-radius:999px; background:rgba(255,255,255,.85); box-shadow:0 5px 18px rgba(46,73,94,.1); color:#526477; font-size:12px; backdrop-filter:blur(10px); }
    .actions { display:flex; gap:8px; pointer-events:auto; }
    .icon-btn { width:38px; height:38px; border:1px solid rgba(210,225,236,.9); border-radius:12px; background:rgba(255,255,255,.9); color:#304a63; cursor:pointer; box-shadow:0 5px 18px rgba(46,73,94,.1); }
    .detail { position:absolute; z-index:2; right:20px; bottom:20px; width:min(330px,calc(100% - 40px)); padding:18px; border:1px solid rgba(211,224,235,.95); border-radius:18px; background:rgba(255,255,255,.94); box-shadow:0 18px 45px rgba(38,65,85,.18); backdrop-filter:blur(12px); transform:translateY(130%); transition:.25s ease; }
    .detail.show { transform:none; }
    .detail small { color:#2d78c8; font-weight:800; }
    .detail h2 { margin:5px 0 8px; font-size:22px; }
    .detail p { margin:0; color:#627286; font-size:13px; word-break:keep-all; }
    .close { position:absolute; top:12px; right:12px; border:0; background:none; color:#728397; font-size:20px; cursor:pointer; }
    .loading { position:absolute; inset:0; display:grid; place-items:center; color:#64768a; font-size:13px; pointer-events:none; }
    .title-badge { position:absolute; z-index:3; top:22px; left:24px; display:flex; align-items:center; gap:11px; pointer-events:none; }
    .title-badge .brand-mark { box-shadow:0 10px 28px rgba(26,63,98,.22); }
    .title-badge h1 { text-shadow:0 2px 12px rgba(255,255,255,.9); }
    .search-panel { position:absolute; z-index:4; top:24px; left:50%; width:min(460px,calc(100% - 210px)); transform:translateX(-50%); }
    .search-panel .search-wrap { filter:drop-shadow(0 12px 25px rgba(35,66,90,.17)); }
    .search-panel #search { height:52px; padding-left:18px; border-color:rgba(201,217,230,.9); border-radius:17px; background:rgba(255,255,255,.94); font-size:15px; backdrop-filter:blur(14px); }
    .search-panel .search-icon { top:15px; font-size:20px; }
    .hint { position:absolute; z-index:2; left:50%; bottom:22px; transform:translateX(-50%); padding:8px 13px; border:1px solid rgba(210,225,236,.85); border-radius:999px; background:rgba(255,255,255,.76); color:#637588; font-size:12px; backdrop-filter:blur(8px); transition:.25s; }
    .locator { position:absolute; z-index:2; width:18px; height:18px; border:3px solid #fff; border-radius:50%; background:#ff4d3d; box-shadow:0 0 0 0 rgba(255,77,61,.5); pointer-events:none; opacity:0; transform:translate(-50%,-50%); }
    .locator.show { opacity:1; animation:ping 1.25s infinite; }
    .floor-chip { position:absolute; z-index:3; left:24px; bottom:24px; display:flex; align-items:center; gap:10px; padding:12px 16px; border:1px solid rgba(198,216,229,.95); border-radius:16px; background:rgba(255,255,255,.94); box-shadow:0 14px 34px rgba(37,68,91,.18); opacity:0; transform:translateY(16px); pointer-events:none; transition:.3s; backdrop-filter:blur(10px); }
    .floor-chip.show { opacity:1; transform:none; }
    .floor-chip b { display:grid; place-items:center; width:42px; height:42px; border-radius:12px; background:#173b62; color:white; font-size:19px; }
    .floor-chip span { display:block; font-size:12px; color:#708195; }
    .floor-chip strong { display:block; margin-top:2px; font-size:15px; }
    .room-label-layer { position:absolute; inset:0; z-index:2; overflow:hidden; pointer-events:none; }
    .room-label { position:absolute; padding:5px 8px; border:1px solid rgba(181,204,221,.95); border-radius:8px; background:rgba(255,255,255,.94); box-shadow:0 4px 12px rgba(38,67,88,.14); color:#17324e; font-size:12px; font-weight:800; line-height:1.15; letter-spacing:-.02em; white-space:nowrap; transform:translate(-50%,-50%); }
    .room-label.selected { z-index:2; padding:7px 10px; border-color:#ff6b42; background:#fff5ef; color:#a83213; box-shadow:0 6px 18px rgba(210,68,30,.25); font-size:14px; }
    @keyframes ping { 70%{box-shadow:0 0 0 22px rgba(255,77,61,0)} 100%{box-shadow:0 0 0 0 rgba(255,77,61,0)} }
    @media (max-width:760px) {
      .map-app { height:100dvh; min-height:520px; }
      .title-badge { top:13px; left:13px; }
      .title-badge h1,.title-badge .sub { display:none; }
      .title-badge .brand-mark { width:39px; height:39px; border-radius:12px; }
      .search-panel { top:12px; left:auto; right:12px; width:calc(100% - 68px); transform:none; }
      .search-panel #search { height:45px; border-radius:14px; font-size:14px; }
      .search-panel .search-icon { top:11px; }
      .topbar { top:68px; left:auto; right:12px; }
      .pill { display:none; }
      .detail { right:12px; bottom:12px; width:calc(100% - 24px); }
      .hint { bottom:12px; white-space:nowrap; }
      .floor-chip { left:12px; bottom:12px; padding:9px 11px; }
    }

    /* ── ALL ABOUT : 공항고 앱과 통일 (강원교육 글씨체 · #54a8f2) ── */
    @font-face{font-family:'GangwonEduPower';font-weight:400;font-style:normal;font-display:swap;
      src:url('./fonts/GangwonEduPower.woff') format('woff');}
    @font-face{font-family:'GangwonEduAll';font-weight:300;font-style:normal;font-display:swap;
      src:url('./fonts/GangwonEduAll-Light.woff') format('woff');}
    @font-face{font-family:'GangwonEduAll';font-weight:700;font-style:normal;font-display:swap;
      src:url('./fonts/GangwonEduAll-Bold.woff') format('woff');}
    :root { --navy:#14588f; --blue:#54a8f2; }
    body { font-family:'GangwonEduAll','Noto Sans KR',system-ui,sans-serif; font-weight:300; }
    h1,h2,.pill,.detail h2,.floor-chip strong,.room-label,.result b,.floor-btn
      { font-family:'GangwonEduPower','GangwonEduAll',sans-serif; font-weight:400; }
    .detail small,strong { font-weight:700; }
    /* 뒤로가기 버튼 */
    .title-badge .back { pointer-events:auto; display:grid; place-items:center; width:42px; height:42px;
      border-radius:14px; background:#54a8f2; color:#fff; font-size:21px; text-decoration:none;
      box-shadow:0 10px 28px rgba(26,63,98,.22); transition:.18s; }
    .title-badge .back:hover { background:#2f8ce0; transform:translateY(-1px); }
    .title-badge h1 { font-size:18px; }
    .title-badge .sub { font-family:'GangwonEduPower',sans-serif; color:#2f8ce0; letter-spacing:.01em; }
    /* 현재 위치 알약이 제목과 겹치지 않도록 아래로 내림 */
    .topbar { justify-content:flex-end; }
    .topbar .pill { position:absolute; left:0; top:74px; }
    /* 앱 기본색 맞추기 */
    .floor-chip b { background:#54a8f2; }
    .switch.on { background:#54a8f2; }
    .detail small { color:#2f8ce0; }
    #search:focus { border-color:#54a8f2; box-shadow:0 0 0 3px rgba(84,168,242,.18); }
    .result:hover { background:#e8f3fe; }
    @media (max-width:760px){
      .title-badge .back { display:grid; width:39px; height:39px; border-radius:12px; font-size:19px; }
      .topbar .pill { display:none; }
      /* 층 표시가 상세 카드와 겹치지 않도록 위쪽으로 */
      .floor-chip { top:70px; left:12px; bottom:auto; transform:translateY(-12px); }
      .floor-chip.show { transform:none; }
    }
  </style>
</head>

  <div class="title-badge"><a class="back" href="./index.html" title="시간표로 돌아가기" aria-label="시간표로 돌아가기">←</a><div><h1>교실 · 선생님 자리 안내도</h1><p class="sub">ALL ABOUT : 공항고</p></div></div>
